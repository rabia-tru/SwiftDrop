name: rider_app
description: "Delivery Rider Tracking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.4
  geolocator: ^13.0.1
  sqflite: ^2.4.1
  path: ^1.9.0
  provider: ^6.1.2
  flutter_local_notifications: ^18.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  socket_io_client: ^3.0.2
  share_plus: ^10.1.4
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.2.0
  lottie: ^3.1.3
  confetti: ^0.7.0
  local_auth: ^2.3.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/animations/
